name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://pbnkrtybgtjotopdobam.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBibmtydHliZ3Rqb3RvcGRvYmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0NjYzMzYsImV4cCI6MjA4MzA0MjMzNn0.GSMqNRxZ6GkI-JV9NkdUxo7hhsSrSLejvNj3ljJTj04' }}

      - name: Set up Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Add Android platform and sync
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Inject custom native files
        run: |
          JAVA_DIR="android/app/src/main/java/app/lovable/flowcall"
          
          # Copy ALL custom Java source files (NativeDialerPlugin, NativeSmsPlugin,
          # CompanionForegroundService, CompanionServicePlugin, MainActivity)
          cp native/android/*.java "$JAVA_DIR/"
          
          # Replace AndroidManifest with our patched version
          cp native/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Inject app icon (FlowCall logo)
        run: |
          pip install Pillow --quiet
          python3 - <<'EOF'
          from PIL import Image
          import os, glob

          logo = "src/assets/flowcall-logo.png"
          res  = "android/app/src/main/res"

          sizes = {
            "mipmap-mdpi":    48,
            "mipmap-hdpi":    72,
            "mipmap-xhdpi":   96,
            "mipmap-xxhdpi":  144,
            "mipmap-xxxhdpi": 192,
          }

          img = Image.open(logo).convert("RGBA")
          for folder, size in sizes.items():
            out_dir = os.path.join(res, folder)
            os.makedirs(out_dir, exist_ok=True)
            resized = img.resize((size, size), Image.LANCZOS)
            resized.save(os.path.join(out_dir, "ic_launcher.png"))
            resized.save(os.path.join(out_dir, "ic_launcher_round.png"))
            # Also create foreground for adaptive icons
            resized.save(os.path.join(out_dir, "ic_launcher_foreground.png"))
            print(f"Written {size}x{size} → {out_dir}")

          # Remove adaptive icon XML files so Android uses our PNGs directly
          for xml in glob.glob(os.path.join(res, "mipmap-anydpi-v26", "*.xml")):
            os.remove(xml)
            print(f"Removed adaptive icon XML: {xml}")

          # Also remove any drawable XML that might override
          for xml in glob.glob(os.path.join(res, "drawable*", "ic_launcher*.xml")):
            os.remove(xml)
            print(f"Removed drawable icon XML: {xml}")

          print("App icons injected successfully")
          EOF

      - name: Make Gradle executable
        run: |
          find android -name "gradlew" -exec chmod +x {} \;
          ls -la android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowcall-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
